<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Danelle Kruger</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <!-- GitHub Pages serves this file for any missing URL, so all paths are absolute -->
  <link rel="icon" href="/DKruger-Virtual-CV/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/DKruger-Virtual-CV/style.css">
</head>

<body class="page-404">
  <main class="not-found">
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="floating-shapes" aria-hidden="true">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <div class="not-found-body">
      <p class="not-found-code" aria-hidden="true">404</p>
      <h1>This page wandered off</h1>
      <p>The link might be broken, or the page may have moved. Let's get you back on track.</p>
      <div class="hero-buttons">
        <a href="/DKruger-Virtual-CV/" class="btn btn-primary btn-glow">
          <span class="btn-text">Back to home</span>
          <span class="btn-icon" aria-hidden="true">→</span>
        </a>
        <a href="/DKruger-Virtual-CV/#projects" class="btn btn-outline">See my work</a>
      </div>
    </div>
  </main>
</body>

</html>
